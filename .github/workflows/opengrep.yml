# Pattern-based static analysis over the tree, with the project's own rules and
# with a pinned revision of the community Python rule set.
#
# The code scanning suite finds what its queries know about. A pattern scanner
# covers a different set cheaply, and more usefully it is where a rule specific
# to this project can be written: the four rules under security/rules/ are about
# untrusted input arriving from seven archives, which is this project's dominant
# class and nothing a general query pack is aimed at.
#
# Self-contained on purpose, for the same reason the other gates here are: the
# scanner is fetched as a release asset pinned to a version and verified against
# a digest before it runs, so what executes is decided in this file rather than
# by whoever owns a marketplace action. The community rules are held to the same
# standard, pinned to a commit rather than named against a registry, so what this
# job scans with is decided here too.
name: Static analysis

on:
  pull_request:
    branches: ["**"]
  push:
    branches: [main]

# Read-only: the scanner reads the checkout and writes nothing back.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned. Moving it is a change to this file with the new digest beside it.
  OPENGREP_VERSION: v1.26.0
  # sha256 of opengrep_manylinux_x86 at that tag, as GitHub reports it:
  #
  #   gh api repos/opengrep/opengrep/releases/tags/v1.26.0 \
  #     --jq '.assets[] | select(.name=="opengrep_manylinux_x86") | .digest'
  #   sha256:40c21299eeddabf743b856daa843d24f9d4a027130671cd45b3b21776fd9ab26
  OPENGREP_SHA256: 40c21299eeddabf743b856daa843d24f9d4a027130671cd45b3b21776fd9ab26
  # The community rule set, pinned the same way and for the same reason. A
  # registry name would resolve to whatever its owner published since the last
  # run, so two runs a month apart would scan with different rules and the
  # difference would be invisible in this file.
  #
  # Pinned by commit rather than by a digest over a downloaded archive. A commit
  # id is the content hash of the tree it names, and git verifies it on checkout,
  # so it is a stronger pin than a digest over a server-generated tarball, whose
  # bytes are not guaranteed stable for one commit.
  #
  #   gh api repos/opengrep/opengrep-rules/commits/main --jq '.sha'
  #   f1d2b562b414783763fd02a6ed2736eaed622efa
  #
  # Licence, read at that commit: semgrep-rules under LGPL 2.1 with the Commons
  # Clause condition added, licensor Semgrep, Inc. That is why the set is fetched
  # at gate time and never vendored into this tree: running it is use, and
  # committing it here would be redistribution under a condition this project has
  # no reason to take on.
  OPENGREP_RULES_REPO: https://github.com/opengrep/opengrep-rules.git
  OPENGREP_RULES_SHA: f1d2b562b414783763fd02a6ed2736eaed622efa

jobs:
  opengrep:
    name: Static analysis (opengrep)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No step pushes, so the token is not persisted into .git/config.
          persist-credentials: false

      - name: Fetch the pinned scanner and verify it
        run: |
          set -euo pipefail
          url="https://github.com/opengrep/opengrep/releases/download/${OPENGREP_VERSION}/opengrep_manylinux_x86"
          curl -sSfL --retry 3 -o opengrep "$url"
          # sha256sum -c fails closed: a mismatch, a short download and a moved
          # asset all end here rather than in a scan by an unknown binary.
          echo "${OPENGREP_SHA256}  opengrep" | sha256sum -c -
          chmod +x opengrep
          ./opengrep --version

      - name: Fetch the pinned community rule set and verify the revision
        # Fetched into the runner's temporary directory and never into the
        # checkout. The community set ships its own fixture files, which are
        # deliberate vulnerabilities, so a copy inside the working tree would be
        # scanned by the step below and would red every run.
        #
        # A shallow fetch of one commit id rather than a clone of a branch: the
        # id is what is pinned, git refuses an object that does not hash to it,
        # and the explicit comparison afterwards fails closed if a future git
        # ever resolves the ref to something else.
        run: |
          set -euo pipefail
          dir="${RUNNER_TEMP}/opengrep-rules"
          rm -rf "$dir"
          mkdir -p "$dir"
          git -C "$dir" init -q
          git -C "$dir" remote add origin "$OPENGREP_RULES_REPO"
          git -C "$dir" fetch -q --depth 1 origin "$OPENGREP_RULES_SHA"
          git -C "$dir" checkout -q FETCH_HEAD
          got=$(git -C "$dir" rev-parse HEAD)
          if [ "$got" != "$OPENGREP_RULES_SHA" ]; then
            echo "::error::Community rule set is at ${got}, expected ${OPENGREP_RULES_SHA}."
            exit 1
          fi
          echo "Community rules at ${got}"

      - name: The project rules fire on their fixtures and stay silent on the neighbours
        # This runs before the scan on purpose. A rule that has stopped matching
        # its own positive fixture would otherwise make the scan below green for
        # the wrong reason, and a green scan is indistinguishable from a rule
        # that no longer refuses anything.
        run: |
          set -euo pipefail
          ./opengrep test security/rules/

      - name: Scan the tree
        # security/rules/ is excluded here and only here. The fixtures in it are
        # deliberate violations, so a scan that included them would be red on
        # every run and the gate would mean nothing. What proves those files are
        # still doing their job is the step above, which asserts the positive
        # and the negative case in each pair rather than merely scanning them.
        #
        # --error is what turns a finding into a failed job; without it the
        # scanner reports and exits zero.
        #
        # One scan with both rule sets rather than two scans. Two would need the
        # exclusion above written twice, and the sentence in
        # security/rules/README.md saying where that exclusion lives is worth
        # more than the separation.
        #
        # Two severities. Every rule under security/rules/ declares ERROR, so the
        # project half is unchanged. The community set puts most of what is worth
        # having at WARNING, so a floor of ERROR alone would fetch a pinned rule
        # set and then ignore nearly all of it, which is the shape of a gate that
        # looks green because it is not looking. INFO is left out: it is style and
        # inventory, not a defect class this project would act on.
        run: |
          set -euo pipefail
          ./opengrep scan \
            --config security/rules/ \
            --config "${RUNNER_TEMP}/opengrep-rules/python" \
            --exclude=security/rules \
            --severity=ERROR \
            --severity=WARNING \
            --error \
            .
