# Deterministic checks over what a pull request carries in git and in its body.
#
# A commit message cannot be corrected once it has landed, only rewritten out of
# history, so a check on one is worth having before the history exists rather
# than after. Everything here reads git and the pull request event, runs no
# project code, installs nothing, and reaches no network, so it stays green
# while the package is still being built and gives the same verdict on every
# run.
#
# Self-contained on purpose: no external action beyond the checkout, for the
# same reason the DCO gate is, which is that a hygiene check delegated to a
# third party is a hygiene check somebody else can change.
name: PR hygiene

on:
  pull_request:
    # `edited` is here for the body leg. A body fixed after the first red run
    # has to be able to turn the check green without an empty commit pushed to
    # force it.
    types: [opened, synchronize, reopened, edited]

# Read-only: every leg reads git history and the event payload.
permissions:
  contents: read

concurrency:
  group: pr-hygiene-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  hygiene:
    name: Deterministic PR-hygiene checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so the base..head range is walkable. No step pushes,
          # so the token is not persisted into .git/config.
          fetch-depth: 0
          persist-credentials: false

      - name: Every commit subject names an issue
        # The subject is what `git bisect` and `git blame` show, and they show
        # nothing else. A reference that lives only in the pull request body is
        # a reference nobody has when they are looking at a bad commit.
        #
        # Merge commits are exempt because their subject is generated by the
        # server. Bot commits are exempt through the same explicit allowlist of
        # GitHub's own identities the DCO gate uses, rather than a `*[bot]@`
        # glob a human could self-exempt with.
        #
        # A pull request from outside this repository reports instead of
        # failing. A contributor who has not opened an issue yet cannot name
        # one, and refusing the contribution is the wrong end to fix that at.
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          IS_FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          set -euo pipefail
          # An `if !` guard rather than `for x in $(...)`: a command substitution
          # that fails inside a for-list does not trip `set -e`, which would pass
          # this leg with nothing walked.
          if ! commits=$(git rev-list --no-merges "$BASE_SHA".."$HEAD_SHA"); then
            echo "::error::Could not walk the commit range ${BASE_SHA}..${HEAD_SHA}."
            exit 1
          fi
          fail=0
          for sha in $commits; do
            author_email=$(git show -s --format='%ae' "$sha")
            case "$author_email" in
              *"+dependabot[bot]@users.noreply.github.com" \
              | "dependabot[bot]@users.noreply.github.com" \
              | *"+github-actions[bot]@users.noreply.github.com" \
              | "github-actions[bot]@users.noreply.github.com")
                echo "skip  $sha (bot: $author_email)"; continue ;;
            esac
            subject=$(git show -s --format='%s' "$sha")
            if printf '%s' "$subject" | grep -qE '#[0-9]+'; then
              echo "ok    $sha  $subject"
            else
              echo "FAIL  $sha names no issue: $subject"
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            if [ "$IS_FORK" = "true" ]; then
              echo "::warning::One or more commit subjects name no issue. Reported and not refused, because this pull request comes from outside the repository."
              exit 0
            fi
            echo "::error::One or more commit subjects name no issue. Put the issue number in the subject line, for example 'Add the thing (#12)', so a bisect or a blame carries it."
            exit 1
          fi
          echo "Every non-merge, non-bot commit subject names an issue."

      - name: Commit messages use only allowed characters
        # An allowlist rather than a list of forbidden characters. A denylist
        # only refuses what somebody already thought of, and the interesting
        # case is the script nobody has written a rule for yet: a homoglyph, a
        # bidirectional override, an invisible separator.
        #
        # The allowlist, and what it was measured against:
        #
        #   Allowed  US-ASCII printable, 0x20 to 0x7E.
        #   Extras   line feed, 0x0A, because a message has lines.
        #   Refused  everything else. That is every other control character,
        #            including tab and carriage return, and every codepoint
        #            above 0x7E.
        #
        # Measured over every commit message reachable from the default branch
        # on the day this landed:
        #
        #   git log --format='%B' origin/main | LC_ALL=C grep -o . | LC_ALL=C sort -u | tr -d '\n'
        #    #'+,-./012345679:<>@ABCDEFGIKLMNPRSTW_`abcdefghijklmnopqrstuvwxyz
        #
        #   git log --format='%B' origin/main | LC_ALL=C grep -n '[^ -~]' ; echo "exit=$?"
        #   exit=1
        #
        # An exit of 1 from grep is no match, so nothing in the history to date
        # sits outside this allowlist and adopting it retires no message that
        # already landed.
        #
        # This leg covers merge commits as well, and it refuses rather than
        # reports on a pull request from outside the repository. A message
        # nobody can read is a problem whoever wrote it, and unlike an issue
        # number it is not something an outside contributor could not have
        # known.
        #
        # The Unicode guard on this repository reads tracked files and never
        # git metadata, so a commit message is outside everything it covers.
        # That is why this leg exists rather than deferring to it.
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if ! commits=$(git rev-list "$BASE_SHA".."$HEAD_SHA"); then
            echo "::error::Could not walk the commit range ${BASE_SHA}..${HEAD_SHA}."
            exit 1
          fi
          fail=0
          for sha in $commits; do
            # grep: 0 is a match, 1 is clean, 2 and up is a scanner error. Fail
            # closed on an error rather than reading a broken scanner as clean.
            rc=0
            offending=$(git show -s --format='%B' "$sha" | LC_ALL=C grep -n '[^ -~]') || rc=$?
            case "$rc" in
              1) echo "ok    $sha" ;;
              0)
                echo "FAIL  $sha carries a character outside the allowlist, on these lines:"
                printf '%s\n' "$offending" | LC_ALL=C cat -v
                fail=1
                ;;
              *)
                echo "::error::Scanner error on $sha (grep exit $rc). Failing closed rather than assuming the message is clean."
                exit 1
                ;;
            esac
          done
          if [ "$fail" -ne 0 ]; then
            echo "::error::A commit message carries a character outside the allowlist of US-ASCII printable plus line feed. The offending lines are printed above with cat -v, so a character that renders as nothing shows as its escape."
            exit 1
          fi
          echo "Every commit message in this range is US-ASCII printable plus line feed."

      - name: The pull request body is not empty and names an issue
        # The body is where everything about a change goes, so an empty one is
        # a change with no argument attached to it.
        #
        # The issue reference is read here the same way it is read in a commit
        # subject, and it is reported rather than refused for a pull request
        # from outside the repository, for the same reason. The empty check
        # still refuses there: a contributor who cannot name an issue can still
        # say what the change does.
        #
        # The body reaches the shell through the environment and is never
        # interpolated into the script, so a body crafted to look like shell is
        # data here and not code.
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          IS_FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          set -euo pipefail
          if [ -z "${PR_BODY//[[:space:]]/}" ]; then
            echo "::error::The pull request body is empty. What the change does, what was verified and what is not covered belong in it."
            exit 1
          fi
          if printf '%s' "$PR_BODY" | grep -qE '#[0-9]+'; then
            echo "The body is not empty and names an issue."
            exit 0
          fi
          if [ "$IS_FORK" = "true" ]; then
            echo "::warning::The pull request body names no issue. Reported and not refused, because this pull request comes from outside the repository."
            exit 0
          fi
          echo "::error::The pull request body names no issue. Reference the issue this change belongs to, for example 'Closes #12'."
          exit 1
