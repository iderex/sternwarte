rules:
  - id: credential-read-outside-the-command-line
    languages: [python]
    severity: ERROR
    message: >-
      A credential is being read from the environment here. Entry 0012 in
      docs/decisions/ puts credential reading in the command line layer and
      keeps it out of the library, because a library that reaches into the
      environment for a token can carry it into a serialised object, a log line
      or a repr without anybody having asked it to. Take the credential as an
      argument and let the shell read it.
    metadata:
      category: security
      subcategory: [audit]
      confidence: MEDIUM
      likelihood: MEDIUM
      impact: MEDIUM
      references:
        - https://cwe.mitre.org/data/definitions/522.html
    paths:
      exclude:
        - "src/sternwarte/cli/**"
        - "src/sternwarte/cli.py"
    patterns:
      - pattern-either:
          - pattern: os.environ[$KEY]
          - pattern: os.environ.get($KEY, ...)
          - pattern: os.getenv($KEY, ...)
          - pattern: environ[$KEY]
          - pattern: getenv($KEY, ...)
      - metavariable-regex:
          metavariable: $KEY
          regex: (?i).*(token|secret|password|passwd|api_?key|credential|auth).*
